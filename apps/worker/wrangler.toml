name = "role"
main = "src/index.ts"
compatibility_date = "2024-12-01"
# Compte Cloudflare de Léo (identifiant public, pas un secret).
account_id = "816c2447a505b8e24917ffe632057fdd"
# Ne pas effacer les variables ajoutées dans le tableau de bord Cloudflare lors d'un déploiement.
keep_vars = true

# Variables non secrètes (modifiables sans redéployer le code via le tableau de bord Cloudflare).
# Les clés d'API se déclarent avec `wrangler secret put GEMINI_API_KEY` (etc.), jamais ici.
[vars]
# Ordre de bascule. Un fournisseur sans clé est simplement ignoré ; « cloudflare » (Workers AI)
# n'a pas besoin de clé et sert de dernier secours. Un modèle qui répond 429 (quota épuisé) passe
# en fin de liste pendant QUOTA_COOLDOWN_S secondes.
PROVIDER_ORDER = "gemini,groq,mistral,cerebras,openrouter,nvidia,cloudflare"
QUOTA_COOLDOWN_S = "120"
# Liste de modèles essayés dans l'ordre (séparés par des virgules). Le premier est l'alias
# tenu à jour par Google vers le dernier Flash ; le second, plus léger, sert de secours.
GEMINI_MODEL = "gemini-flash-latest,gemini-flash-lite-latest"
# Réflexion des modèles Gemini 3 : "low" garde des réponses rapides (le défaut "high" peut
# dépasser le délai et provoquer une erreur 524). Si le modèle refuse ce réglage, il est retiré.
GEMINI_THINKING_LEVEL = "low"
# Ancien réglage (Gemini 2.5), ignoré si GEMINI_THINKING_LEVEL est rempli.
GEMINI_THINKING_BUDGET = ""
# llama-3.3-70b-versatile a été retiré par Groq le 16/08/2026.
GROQ_MODEL = "openai/gpt-oss-120b,openai/gpt-oss-20b"
# Modèles « :free » d'OpenRouter : 50 requêtes/jour au total (1 000 si 10 $ de crédit ont été achetés).
OPENROUTER_MODEL = "meta-llama/llama-3.3-70b-instruct:free,openai/gpt-oss-120b:free"
# Mistral (offre « Experiment » gratuite, très bon en français) : clé MISTRAL_API_KEY.
MISTRAL_MODEL = "mistral-medium-latest,mistral-small-latest"
# Cerebras (offre gratuite, ~1 million de jetons/jour) : clé CEREBRAS_API_KEY.
CEREBRAS_MODEL = "gpt-oss-120b"
# NVIDIA (build.nvidia.com, gratuit pour le prototypage) : clé NVIDIA_API_KEY.
NVIDIA_MODEL = "meta/llama-3.3-70b-instruct"
# Cloudflare Workers AI (liaison AI ci-dessous, sans clé, 10 000 neurones gratuits/jour).
CLOUDFLARE_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast,@cf/mistralai/mistral-small-3.1-24b-instruct"
# Origines autorisées (séparées par des virgules). "*" pour tout autoriser en développement.
ALLOWED_ORIGINS = "*"
RATE_LIMIT_PER_IP_PER_MIN = "20"
RATE_LIMIT_PER_GAME_PER_MIN = "12"
RATE_LIMIT_PER_IP_PER_DAY = "600"
MAX_OUTPUT_TOKENS = "1500"
# Voix du MJ (bouton « Écouter ») : modèles TTS Gemini essayés dans l'ordre, même clé que le texte.
GEMINI_TTS_MODEL = "gemini-2.5-flash-preview-tts"
# Voix par défaut (Algenib : grave et rocailleuse). Autres voix graves : Charon, Iapetus, Gacrux…
GEMINI_TTS_VOICE = "Algenib"
TTS_PER_IP_PER_DAY = "80"

# Le même Worker sert aussi l'application web (fichiers statiques de apps/web/dist) :
# une seule adresse, pas de CORS, et /api/* est traité par le code du relais.
# Construire le front avant `wrangler dev` / `wrangler deploy` : npm run build (à la racine).
[assets]
directory = "../web/dist"

# Cloudflare Workers AI : dernier secours du MJ, sans clé d'API.
[ai]
binding = "AI"

# Multijoueur : une salle (Durable Object SQLite, offre gratuite) par partie, identifiée par son code.
[[durable_objects.bindings]]
name = "SALLES"
class_name = "Salle"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Salle"]
