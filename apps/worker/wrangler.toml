name = "role"
main = "src/index.ts"
compatibility_date = "2024-12-01"
# Compte Cloudflare de Léo (identifiant public, pas un secret).
account_id = "816c2447a505b8e24917ffe632057fdd"
# Ne pas effacer les variables ajoutées dans le tableau de bord Cloudflare lors d'un déploiement.
keep_vars = true

# Variables non secrètes (modifiables sans redéployer le code via le tableau de bord Cloudflare).
# Les clés d'API se déclarent avec `wrangler secret put GEMINI_API_KEY` (etc.), jamais ici.
[vars]
PROVIDER_ORDER = "gemini,groq,openrouter"
# Liste de modèles essayés dans l'ordre (séparés par des virgules). Le premier est l'alias
# tenu à jour par Google vers le dernier Flash ; le second, plus léger, sert de secours.
GEMINI_MODEL = "gemini-flash-latest,gemini-flash-lite-latest"
# Réflexion des modèles Gemini 3 : "low" garde des réponses rapides (le défaut "high" peut
# dépasser le délai et provoquer une erreur 524). Si le modèle refuse ce réglage, il est retiré.
GEMINI_THINKING_LEVEL = "low"
# Ancien réglage (Gemini 2.5), ignoré si GEMINI_THINKING_LEVEL est rempli.
GEMINI_THINKING_BUDGET = ""
# llama-3.3-70b-versatile a été retiré par Groq le 16/08/2026.
GROQ_MODEL = "openai/gpt-oss-120b,openai/gpt-oss-20b"
OPENROUTER_MODEL = "meta-llama/llama-3.3-70b-instruct:free"
# Origines autorisées (séparées par des virgules). "*" pour tout autoriser en développement.
ALLOWED_ORIGINS = "*"
RATE_LIMIT_PER_IP_PER_MIN = "20"
RATE_LIMIT_PER_GAME_PER_MIN = "12"
RATE_LIMIT_PER_IP_PER_DAY = "600"
MAX_OUTPUT_TOKENS = "1500"

# Le même Worker sert aussi l'application web (fichiers statiques de apps/web/dist) :
# une seule adresse, pas de CORS, et /api/* est traité par le code du relais.
# Construire le front avant `wrangler dev` / `wrangler deploy` : npm run build (à la racine).
[assets]
directory = "../web/dist"
